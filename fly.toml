app = "kfdesktopbe"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Environment variables matching .env.example
# Sensitive values (DATABASE_URL, REDIS_URL, DB_PASSWORD, REDIS_PASSWORD, FIREBASE_CREDENTIALS_JSON)
# should be configured as Fly secrets via: fly secrets set KEY=VALUE
[env]
  PORT = "8080"
  ENVIRONMENT = "production"
  DB_PORT = "5432"
  DB_NAME = "kfdesktop"
  DB_USER = "postgres"
  DB_SSLMODE = "disable"
  REDIS_PORT = "6379"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
